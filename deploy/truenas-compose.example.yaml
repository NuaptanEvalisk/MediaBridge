# TrueNAS SCALE 25.10 Custom App template.
# DO NOT deploy unchanged: build/publish the server image, verify dataset paths,
# configure Cloudflare Access, and verify the management source-IP allowlist.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.2
    hostname: media-ingest
    # Run tailscaled directly. containerboot exits after an interactive login
    # times out, which must not take the management WebUI offline.
    entrypoint: ["/usr/local/bin/tailscaled"]
    command:
      - --state=/var/lib/tailscale/tailscaled.state
      - --socket=/run/tailscale/tailscaled.sock
      - --tun=tailscale0
    volumes:
      - /mnt/POOL/apps/mediabridge/tailscale:/var/lib/tailscale
      - tailscale-socket:/run/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  mediabridge:
    # Replace this placeholder with an actually published image.
    image: ghcr.io/nuaptanevalisk/mediabridge-server:latest
    user: "0:568"
    # Independent network namespace: restarting tailscale must not orphan the
    # management WebUI. The sidecar forwards TCP 8081 using Tailscale Serve.
    depends_on:
      - tailscale
    ports:
      # Management only. Do NOT publish receiver port 8081.
      - "NAS_LAN_IP:30079:8080/tcp"
    environment:
      MB_MEDIA_DIR: /media
      MB_STATE_DIR: /state
      MB_TS_SOCKET: /run/tailscale/tailscaled.sock
      MB_ADMIN_ALLOWED_CIDRS: "ZBOOK_LAN_IP/32,127.0.0.1/32,::1/128"
    volumes:
      - /mnt/POOL/data/media:/media:rw
      - /mnt/POOL/apps/mediabridge/server:/state:rw
      - tailscale-socket:/run/tailscale
    cap_drop:
      - ALL
    cap_add:
      # Required to give committed media files UID 33 / GID 568.
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  tailscale-socket:
